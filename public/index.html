<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1020"><title>AGENTLAR OFISI</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b1020;color:#e8edf8;font:15px system-ui,Arial}header{padding:18px 16px;background:#111a2d;border-bottom:1px solid #25324a;position:sticky;top:0;z-index:2}h1{font-size:19px;margin:0}small,.muted{color:#98a7c2}.wrap{max-width:1100px;margin:auto;padding:14px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.agent,.panel{background:#121d32;border:1px solid #273651;border-radius:14px;padding:13px}.agent{border-left:4px solid var(--c)}.agent b{display:block}.agent small{font-size:12px}.status{font-size:12px;color:#7ee0b1;margin-top:8px}.panel{margin-top:14px}label{display:block;margin:10px 0 6px;color:#b8c5dc}input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid #34445f;background:#0c1527;color:#fff;font:inherit}textarea{min-height:100px;resize:vertical}button{background:#547df5;color:white;border:0;border-radius:10px;padding:12px 16px;font-weight:700;width:100%;margin-top:10px}.row{display:flex;gap:9px;align-items:center}.row>*{flex:1}.result{white-space:pre-wrap;line-height:1.5;background:#0c1527;border-radius:10px;padding:12px;margin-top:12px}.event{padding:9px 0;border-bottom:1px solid #26344c;font-size:13px}.pill{display:inline-block;background:#1d3150;padding:4px 8px;border-radius:20px;font-size:11px;color:#c4d5f3}.hidden{display:none}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wrap{padding:10px}.agent{padding:10px}}@media(max-width:360px){.grid{grid-template-columns:1fr}}
</style></head><body><header><div class="wrap" style="padding:0"><h1>🏢 AGENTLAR OFISI</h1><small>Bulutli boshqaruv paneli · Telefon uchun</small></div></header><main class="wrap">
<section id="login" class="panel"><b>Ofisga kirish</b><label>Administrator paroli</label><input id="pw" type="password" autocomplete="current-password" placeholder="Server parolini kiriting"><button onclick="login()">Kirish</button><p id="loginErr" class="muted"></p></section>
<div id="app" class="hidden"><div class="row"><span class="pill" id="claudeState">Claude: tekshirilmoqda</span><span class="pill" id="openaiState">OpenAI: tekshirilmoqda</span><span class="pill" id="gatewayState">Termux Gateway: tekshirilmoqda</span></div>
<h3>Jamoa — 9 xodim</h3><div class="grid" id="agents"></div>
<section class="panel"><h3>Yangi vazifa berish</h3><label>AI provayder</label><select id="provider"><option value="claude">Claude</option><option value="openai">OpenAI</option><option value="gateway">Termux Gateway (OmniRoute)</option></select><label>Xodim</label><select id="agent"></select><label>Vazifa</label><textarea id="prompt" placeholder="Masalan: yangi loyiha uchun marketing rejasini tuz..."></textarea><button onclick="sendTask()">Vazifani yuborish</button><div id="result" class="result hidden"></div></section>
<section class="panel"><h3>Oxirgi hodisalar</h3><div id="events" class="muted">Hozircha hodisa yo‘q</div></section></div></main>
<script>
let password="";
async function api(url,opts={}){opts.headers={...(opts.headers||{}),"x-admin-password":password,"content-type":"application/json"};const r=await fetch(url,opts);const j=await r.json();if(!r.ok)throw Error(j.error||"Server xatosi");return j}
async function login(){password=document.getElementById("pw").value;try{await refresh();document.getElementById("login").classList.add("hidden");document.getElementById("app").classList.remove("hidden")}catch(e){document.getElementById("loginErr").textContent=e.message}}
async function refresh(){const d=await api("/api/status");document.getElementById("claudeState").textContent="Claude: "+(d.providers.claude?"ulangan":"API kalit kerak");document.getElementById("openaiState").textContent="OpenAI: "+(d.providers.openai?"ulangan":"API kalit kerak");document.getElementById("gatewayState").textContent="Termux Gateway: "+(d.providers.gateway?"ulangan":"sozlanmagan");document.getElementById("agents").innerHTML=d.agents.map(a=>`<div class="agent" style="--c:${a.color}"><b>${a.name}</b><small>${a.role}<br>${a.dept}</small><div class="status">● Bulutdagi agent</div></div>`).join("");document.getElementById("agent").innerHTML='<option value="">Avtomatik tanlash</option>'+d.agents.map(a=>`<option value="${a.id}">${a.name} — ${a.role}</option>`).join("");document.getElementById("events").innerHTML=d.events.length?d.events.map(e=>`<div class="event"><b>${e.agent}</b> · ${e.text}<br><small>${new Date(e.at).toLocaleString("uz-UZ")}</small></div>`).join(""):"Hozircha hodisa yo‘q"}
async function sendTask(){const result=document.getElementById("result");result.classList.remove("hidden");result.textContent="Vazifa yuborilmoqda...";try{const t=await api("/api/command",{method:"POST",body:JSON.stringify({prompt:document.getElementById("prompt").value,agent:document.getElementById("agent").value,provider:document.getElementById("provider").value})});result.textContent="✅ "+t.task.agent+" · "+t.task.provider+"\n\n"+t.task.result;await refresh()}catch(e){result.textContent="Xatolik: "+e.message}}
</script></body></html>
